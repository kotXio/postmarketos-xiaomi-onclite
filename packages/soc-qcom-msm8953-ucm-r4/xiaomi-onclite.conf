Syntax 6

SectionUseCase."HiFi" {
	File "/Xiaomi/onclite/HiFi.conf"
	Comment "Play and record HiFi quality Music"
}

Include.card-init.File "/lib/card-init.conf"
Include.speaker-pcm.File "/Xiaomi/onclite/SpeakerPCM.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"

BootSequence [
	# Keep the external speaker amplifier disabled until explicitly selected.
	cset "name='Speaker Amp Enable Switch' 0"
	cset "name='Speaker Switch' 0"
	cset "name='LINEOUT' ZERO"
	cset "name='RX3 MIX1 INP1' ZERO"

	# Headphones and Earpiece Volume
	cset "name='RX1 Digital Volume' 84"
	cset "name='RX2 Digital Volume' 84"

	# Speaker Volume
	cset "name='RX3 Digital Volume' 84"

	# Headphones Mic Analog
	cset "name='ADC2 Volume' 8"

	# Primary Mic Analog
	cset "name='ADC1 Volume' 8"

	# Secondary Mic Analog
	cset "name='ADC3 Volume' 8"
]
