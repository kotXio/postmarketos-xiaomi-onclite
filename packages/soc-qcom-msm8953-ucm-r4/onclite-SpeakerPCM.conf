# Private UCM PCM for the Redmi 7 AW87329 speaker.
#
# Keep the static codec route selected while Speaker is the active UCM device,
# but release the external amplifier whenever no playback PCM is open.
# Defining this directly below pcm also makes it available through UCM's
# per-manager _ucmXXXX namespace used by PulseAudio during profile probing.
LibraryConfig.generic.Config.pcm.onclite-speaker {
	@args [ CARD ]
	@args.CARD {
		type string
	}
	type hooks
	slave.pcm {
		type hw
		card $CARD
		device 0
	}
	hooks.0 {
		type ctl_elems
		hook_args [
			{
				name "Speaker Amp Enable Switch"
				preserve true
				value true
			}
		]
	}
}
